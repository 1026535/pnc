name: Portable tests

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Exact candidate commit SHA, branch, or tag'
        required: true
        type: string
      base:
        description: 'Ancestor commit SHA, branch, or tag to compare with the candidate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: portable-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Portable shard ${{ matrix.shard }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out requested candidate with selection history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install portable test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run affected portable tests
        env:
          TEST_EVENT: ${{ github.event_name }}
          TEST_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || inputs.base }}
        run: |
          $testBase = $env:TEST_BASE_SHA
          if ($env:TEST_EVENT -eq 'schedule') {
            $testBase = 'HEAD^'
          }
          if ([string]::IsNullOrWhiteSpace($testBase) -or $testBase -match '^0+$') {
            throw 'Affected CI requires a nonempty comparison base; use manual ref/base inputs for an initial push.'
          }
          $resolvedBase = git rev-parse --verify --end-of-options "${testBase}^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "Comparison base is not an available commit: $testBase"
          }
          git merge-base --is-ancestor "$resolvedBase" HEAD
          if ($LASTEXITCODE -ne 0) {
            throw 'Comparison base must be an ancestor of the checked-out candidate.'
          }
          python -u tools/run_tests.py affected --base "$resolvedBase" --shard-index ${{ matrix.shard }} --shard-count 4 --verbose --explain --json .test-impact/selection.json --results .test-impact/results.json --csv .test-impact/timings.csv
          exit $LASTEXITCODE

      - name: Upload selection and result evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-tests-${{ github.run_id }}-${{ github.run_attempt }}-shard-${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .test-impact/selection.json
            .test-impact/results.json
            .test-impact/timings.csv

  portable:
    name: Portable tests (affected)
    if: always()
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every selected-test shard to pass
        env:
          SHARD_RESULT: ${{ needs.offline.result }}
        run: test "$SHARD_RESULT" = success
