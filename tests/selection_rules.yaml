version: 1
full:
  - pyproject.toml
  - requirements*
  - setup.*
  - MANIFEST.in
  - .github/*
  - .gitignore
  - tools/run_tests.py
  - tools/test_selection/*
  - tests/selection_rules.yaml
  - tests/__init__.py
  - tests/support/paths.py
  - tests/support/python_sources.py
  - tests/*/__init__.py
  - tests/data/screen_recognition/manifest.json
  - tests/data/screen_recognition/replacement_core_provenance.json
  - tests/local_fixture_artifacts.py
  - pnc_automation/*/__init__.py
  - pnc_automation/__init__.py
  - pnc_automation/app/authoring/config/*
  - pnc_automation/core/config/*
  - pnc_automation/app/authoring/scripts/registry.py
  - pnc_automation/app/entrypoints/app.py
  - pnc_automation/app/entrypoints/task_registry.py
  - pnc_automation/app/entrypoints/daily_maintenance.py
documentation:
  - '*.md'
resources:
  - pattern: tests/data/home_city_slot_bodies/*
    groups: [unit.app.pnc.vision.home_city_camera, integration.vision.home_city_camera]
  - pattern: pnc_automation/app/pnc/vision/data/home_city_camera/*
    groups: [unit.app.pnc.navigation]
  - pattern: pnc_automation/app/pnc/vision/data/*
    groups: [vision, integration]
  - pattern: pnc_automation/templates/*
    groups: [vision, integration]
  - pattern: scripts/*.yaml
    groups: [integration, contract]
  - pattern: config/*.yaml
    groups: [integration, contract]
  - pattern: config/*.json
    groups: [vision, integration]
  - pattern: .agents/skills/devin-implement/scripts/devin_worker.py
    groups: [unit.tools.agent_runtime]
  - pattern: .agents/skills/devin-implement/scripts/devin_monitor.py
    groups: [unit.tools.agent_runtime]
  - pattern: .agents/skills/devin-implement/scripts/devin_acp.py
    groups: [unit.tools.agent_runtime]
  - pattern: .agents/skills/devin-implement/scripts/windows_job.py
    groups: [unit.tools.agent_runtime]
  - pattern: .agents/skills/devin-game-knowledge/scripts/consult_game_knowledge.py
    groups: [unit.tools.agent_runtime]
