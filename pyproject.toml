[project]
name = "pnc-automation"
version = "0.1.0"
description = "Puzzles & Conquest automation platform driven by ADB and screenshots."
requires-python = ">=3.13"
dependencies = [
    "PyYAML>=6.0.3,<7.0.0",
    "Pillow>=12.1.1,<13.0.0",
    "rapidocr_onnxruntime>=1.2.3,<2.0.0",
]

[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pnc_automation"]

[tool.setuptools.package-data]
"pnc_automation" = ["py.typed"]
