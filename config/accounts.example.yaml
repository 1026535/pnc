artifacts:
  root: artifacts

archives:
  root: archives

runtime:
  observation_mode: debug

defaults:
  adb_path: adb
  bluestacks_config_path: C:\ProgramData\BlueStacks_nxt\bluestacks.conf
  screenshot_format: png
  stable_click_delay_ms: 300
  post_action_observe_delay_ms: 800
  chat_stable_click_delay_ms: 120
  chat_post_action_observe_delay_ms: 250

instances:
  - id: bs-main
    display_name: serious_stuff
    app_package: com.global.tmslg

accounts:
  - id: primary-account
    instance_id: bs-main
    pnc_account_id: your_pnc_account_id
    username: your-email@example.com
    password: your-password
